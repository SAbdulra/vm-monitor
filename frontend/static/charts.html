<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VM Monitor - Historical Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f23 100%);
            color: white;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #000 0%, #1a1a2e 100%);
            border-left: 5px solid #00d4ff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #00d4ff;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        select, input {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: white;
        }
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        .chart-card h3 {
            margin-bottom: 15px;
            color: #00d4ff;
        }
        canvas {
            max-height: 300px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .stat-label { font-size: 12px; color: #999; }
        .stat-value { font-size: 20px; font-weight: bold; color: #00d4ff; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Historical Metrics Charts</h1>
            <a href="/" class="back-link">← Back to Dashboard</a>
        </div>

        <div class="controls">
            <label>
                VM:
                <select id="hostname">
                    <option value="">Loading...</option>
                </select>
            </label>
            <label>
                Time Range:
                <select id="timeRange">
                    <option value="1h">Last Hour</option>
                    <option value="6h">Last 6 Hours</option>
                    <option value="24h" selected>Last 24 Hours</option>
                    <option value="7d">Last 7 Days</option>
                    <option value="30d">Last 30 Days</option>
                </select>
            </label>
            <button id="loadBtn">Load Charts</button>
            <button id="refreshBtn">↻ Refresh</button>
        </div>

        <div id="charts" class="chart-grid">
            <div class="loading">Select a VM and click "Load Charts"</div>
        </div>
    </div>

    <script>
        let charts = {};
        let currentData = null;

        // Load VM list
        async function loadVMs() {
            try {
                const response = await fetch('/api/vms');
                const data = await response.json();
                const vms = data.vms || [];

                const select = document.getElementById('hostname');
                select.innerHTML = vms.map(vm =>
                    `<option value="${vm.name || vm.hostname}">${vm.name || vm.hostname}</option>`
                ).join('');

                console.log('Loaded', vms.length, 'VMs');
            } catch(e) {
                console.error('Error loading VMs:', e);
            }
        }

        // Load historical data
        async function loadHistoricalData() {
            const hostname = document.getElementById('hostname').value;
            const timeRange = document.getElementById('timeRange').value;

            if (!hostname) {
                alert('Please select a VM');
                return;
            }

            document.getElementById('charts').innerHTML = '<div class="loading">Loading data...</div>';

            try {
                const response = await fetch(`/api/vms/${hostname}/history?range=${timeRange}`);
                currentData = await response.json();

                renderCharts(currentData);
            } catch(e) {
                console.error('Error loading historical data:', e);
                document.getElementById('charts').innerHTML =
                    '<div class="loading" style="color:#ef4444;">Error loading data. Check console.</div>';
            }
        }

        // Render charts
        function renderCharts(data) {
            // Destroy existing charts
            Object.values(charts).forEach(chart => chart.destroy());
            charts = {};

            const container = document.getElementById('charts');
            container.innerHTML = '';

            if (!data.timestamps || data.timestamps.length === 0) {
                container.innerHTML = '<div class="loading">No historical data available</div>';
                return;
            }

            // CPU Chart
            const cpuCard = createChartCard('CPU Usage Over Time', 'cpu');
            container.appendChild(cpuCard);
            charts.cpu = createLineChart('cpu', data.timestamps, [
                {
                    label: 'Average CPU',
                    data: data.metrics.cpu.map(d => d.avg),
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    fill: true
                },
                {
                    label: 'Max CPU',
                    data: data.metrics.cpu.map(d => d.max),
                    borderColor: '#ef4444',
                    backgroundColor: 'transparent',
                    borderDash: [5, 5]
                }
            ]);

            // Add CPU stats
            const cpuStats = calculateStats(data.metrics.cpu.map(d => d.avg));
            addStats(cpuCard, cpuStats);

            // Memory Chart
            const memCard = createChartCard('Memory Usage Over Time', 'memory');
            container.appendChild(memCard);
            charts.memory = createLineChart('memory', data.timestamps, [
                {
                    label: 'Average Memory',
                    data: data.metrics.memory.map(d => d.avg),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true
                },
                {
                    label: 'Max Memory',
                    data: data.metrics.memory.map(d => d.max),
                    borderColor: '#f59e0b',
                    backgroundColor: 'transparent',
                    borderDash: [5, 5]
                }
            ]);

            const memStats = calculateStats(data.metrics.memory.map(d => d.avg));
            addStats(memCard, memStats);

            // Disk Chart
            const diskCard = createChartCard('Disk Usage Over Time', 'disk');
            container.appendChild(diskCard);
            charts.disk = createLineChart('disk', data.timestamps, [
                {
                    label: 'Average Disk',
                    data: data.metrics.disk.map(d => d.avg),
                    borderColor: '#8b5cf6',
                    backgroundColor: 'rgba(139, 92, 246, 0.1)',
                    fill: true
                },
                {
                    label: 'Max Disk',
                    data: data.metrics.disk.map(d => d.max),
                    borderColor: '#ec4899',
                    backgroundColor: 'transparent',
                    borderDash: [5, 5]
                }
            ]);

            const diskStats = calculateStats(data.metrics.disk.map(d => d.avg));
            addStats(diskCard, diskStats);
        }

        function createChartCard(title, id) {
            const card = document.createElement('div');
            card.className = 'chart-card';
            card.innerHTML = `
                <h3>${title}</h3>
                <canvas id="chart-${id}"></canvas>
            `;
            return card;
        }

        function createLineChart(id, labels, datasets) {
            const ctx = document.getElementById(`chart-${id}`).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { labels: { color: 'white' } }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { color: 'white', callback: value => value + '%' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: {
                                color: 'white',
                                maxRotation: 45,
                                minRotation: 45
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });
        }

        function calculateStats(data) {
            const valid = data.filter(d => d !== null && d !== undefined);
            if (!valid.length) return { avg: 0, max: 0, min: 0 };

            return {
                avg: (valid.reduce((a, b) => a + b, 0) / valid.length).toFixed(1),
                max: Math.max(...valid).toFixed(1),
                min: Math.min(...valid).toFixed(1)
            };
        }

        function addStats(card, stats) {
            const statsRow = document.createElement('div');
            statsRow.className = 'stats-row';
            statsRow.innerHTML = `
                <div class="stat-item">
                    <div class="stat-label">Average</div>
                    <div class="stat-value">${stats.avg}%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Maximum</div>
                    <div class="stat-value">${stats.max}%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Minimum</div>
                    <div class="stat-value">${stats.min}%</div>
                </div>
            `;
            card.appendChild(statsRow);
        }

        // Event listeners
        document.getElementById('loadBtn').addEventListener('click', loadHistoricalData);
        document.getElementById('refreshBtn').addEventListener('click', loadHistoricalData);

        // Initialize
        loadVMs();
    </script>
</body>
</html>
